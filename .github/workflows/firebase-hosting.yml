# Pubblica l'app (cartella inventario/) su Firebase Hosting a ogni push su main.
# Serve il segreto FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: edicola-mannelli
          channelId: live
