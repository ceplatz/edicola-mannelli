<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Edicola Mannelli — Duomo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:        #E9DEC8;
  --sand-2:      #F3ECDC;
  --sand-3:      #FBF7EE;
  --line:        #D9CBB0;
  --espresso:    #3A2E28;
  --espresso-2:  #6B584E;
  --coral:       #F26D8B;
  --coral-2:     #FF7E5F;
  --peach:       #FFB088;
  --gold:        #B08A54;
  --ok:          #4CA477;
  --danger:      #C74444;
  --shadow:      0 6px 22px rgba(58,46,40,.12);
  --shadow-lg:   0 18px 50px rgba(58,46,40,.22);
  --federica: linear-gradient(135deg,#E94FA1 0%,#F26D8B 32%,#FF7E5F 66%,#FFB088 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sand);color:var(--espresso);overflow:hidden;user-select:none;-webkit-user-select:none}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Header */
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--sand-3);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(58,46,40,.05);z-index:20}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:52px;width:auto;object-fit:contain}
.brand .wordmark{display:none;flex-direction:column;line-height:1}
.brand .wordmark .b1{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.28em;font-size:13px;color:var(--espresso-2)}
.brand .wordmark .b2{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.06em;font-size:26px;color:var(--espresso)}
.brand.fallback img{display:none}
.brand.fallback .wordmark{display:flex}
.locale{margin-left:6px;padding:4px 14px;border-left:1px solid var(--line);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase}
.header-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.clock{text-align:right;line-height:1.15}
.clock .t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px}
.clock .d{font-size:11px;color:var(--espresso-2);text-transform:capitalize;letter-spacing:.02em}
.takings{text-align:right;padding:6px 16px;border-radius:12px;background:var(--sand);border:1px solid var(--line)}
.takings .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--espresso-2)}
.takings .val{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:var(--espresso)}
.report-btn{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--sand-3);color:var(--espresso);font-weight:700;font-size:14px;cursor:pointer}
.report-btn:active{transform:scale(.96)}
.report-btn .ic{font-size:17px}

/* Staff */
.staff{display:flex;gap:8px;padding:10px 20px;background:var(--sand-2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.staff::-webkit-scrollbar{display:none}
.emp{flex:0 0 auto;padding:9px 20px;border-radius:11px;cursor:pointer;font-weight:700;font-size:15px;color:var(--espresso-2);background:var(--sand-3);border:1.5px solid var(--line);transition:transform .12s ease,box-shadow .12s ease;white-space:nowrap;display:flex;align-items:center;gap:7px;position:relative}
.emp:active{transform:scale(.96)}
.emp.active{color:#fff;background:var(--espresso);border-color:var(--espresso);box-shadow:var(--shadow)}
.emp .cart-dot{min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}
.emp.has-cart .cart-dot{display:flex}
.emp.fede{color:#fff;background:var(--federica);border:none;background-size:200% 200%;box-shadow:0 6px 18px rgba(233,79,161,.35);animation:bloom 7s ease infinite}
.emp.fede .flower{font-size:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.emp.fede.active{outline:3px solid rgba(255,255,255,.85);outline-offset:2px;transform:translateY(-1px)}
.emp.fede .cart-dot{background:#fff;color:var(--coral)}
@keyframes bloom{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* Categories */
.cats{display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:7px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--espresso-2);background:transparent;border:1.5px solid var(--line);transition:all .12s ease;white-space:nowrap}
.cat:active{transform:scale(.95)}
.cat.active{color:#fff;background:var(--coral);border-color:var(--coral);box-shadow:0 4px 12px rgba(242,109,139,.35)}

/* Main */
main{flex:1;display:flex;min-height:0}
.products-wrap{flex:1;overflow-y:auto;padding:14px 20px 24px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.tile{background:var(--sand-3);border:1.5px solid var(--line);border-radius:16px;padding:14px 12px 12px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:118px;transition:transform .1s ease,box-shadow .1s ease,border-color .1s ease}
.tile:active{transform:scale(.96)}
.tile:hover{box-shadow:var(--shadow);border-color:var(--peach)}
.tile .emoji{font-size:30px;line-height:1}
.tile .nm{font-weight:700;font-size:14px;line-height:1.2;color:var(--espresso)}
.tile .pr{margin-top:auto;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;color:var(--espresso)}
.tile .badge{position:absolute;top:8px;right:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--coral);color:#fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(242,109,139,.5)}
.tile.incart{border-color:var(--coral);background:linear-gradient(180deg,#fff6f3,var(--sand-3))}
.tile.incart .badge{display:flex}

/* Cart */
.cart{width:360px;flex:0 0 360px;background:var(--sand-3);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(58,46,40,.06)}
.cart-head{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.cart-head .title-row{display:flex;align-items:baseline;justify-content:space-between}
.cart-head .title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px}
.cart-head .receipt-no{font-size:12px;color:var(--espresso-2);letter-spacing:.03em}
.cart-head .whose{margin-top:2px;font-size:12px;color:var(--espresso-2)}
.cart-head .whose b{color:var(--coral)}
.cart-items{flex:1;overflow-y:auto;padding:8px 14px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--espresso-2);text-align:center;padding:20px}
.empty .big{font-size:44px;opacity:.5}
.empty .txt{font-family:'Cormorant Garamond',serif;font-size:20px}
.ci{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px dashed var(--line)}
.ci .ci-nm{flex:1;min-width:0}
.ci .ci-nm .n{font-weight:700;font-size:14px}
.ci .ci-nm .p{font-size:12px;color:var(--espresso-2)}
.qty{display:flex;align-items:center;gap:8px}
.qbtn{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--sand-2);font-size:19px;font-weight:700;color:var(--espresso);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.qbtn:active{transform:scale(.9)}
.qbtn.minus{color:var(--coral-2)}
.qnum{min-width:20px;text-align:center;font-weight:700;font-size:15px}
.ci .ci-tot{width:66px;text-align:right;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:17px}
.cart-foot{padding:14px 20px 18px;border-top:1px solid var(--line);background:var(--sand-2)}
.rows{margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--espresso-2);margin:3px 0}
.row.total{color:var(--espresso);align-items:baseline;margin-top:8px}
.row.total .lab{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700}
.row.total .amt{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700}
.cart-actions{display:flex;gap:10px}
.btn{border:none;border-radius:13px;padding:16px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;cursor:pointer;transition:transform .1s ease,filter .1s ease;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-clear{flex:0 0 auto;background:var(--sand-3);color:var(--espresso-2);border:1.5px solid var(--line);padding:16px 18px}
.btn-pay{flex:1;color:#fff;background:linear-gradient(135deg,var(--coral),var(--coral-2));box-shadow:0 8px 22px rgba(242,109,139,.4)}
.btn-pay:not(:disabled):hover{filter:brightness(1.04)}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(58,46,40,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{width:100%;max-width:440px;background:var(--sand-3);border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:22px 24px 6px;text-align:center}
.modal-head .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--espresso-2)}
.modal-head .big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:46px;color:var(--espresso);line-height:1.1}
.pay-tabs{display:flex;gap:10px;padding:16px 24px 6px}
.pay-tab{flex:1;padding:14px;border-radius:13px;border:2px solid var(--line);background:var(--sand-2);cursor:pointer;font-weight:700;font-size:15px;text-align:center;color:var(--espresso-2);display:flex;flex-direction:column;align-items:center;gap:4px}
.pay-tab .ic{font-size:24px}
.pay-tab.active{border-color:var(--coral);color:var(--espresso);background:#fff6f3}
.cash-zone{padding:8px 24px 4px;display:none}
.cash-zone.show{display:block}
.cash-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.cash-btn{padding:12px 4px;border-radius:11px;border:1.5px solid var(--line);background:var(--sand-2);font-weight:700;font-size:15px;cursor:pointer;color:var(--espresso)}
.cash-btn:active{transform:scale(.94)}
.cash-btn.sel{background:var(--espresso);color:#fff;border-color:var(--espresso)}
.change-line{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px 2px;font-size:15px;color:var(--espresso-2)}
.change-line .chg{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;color:var(--ok)}
.modal-foot{padding:14px 24px 22px;display:flex;gap:10px}
.btn-cancel{flex:0 0 auto;background:var(--sand-2);color:var(--espresso-2);border:1.5px solid var(--line);padding:16px 20px}
.btn-confirm{flex:1;color:#fff;background:linear-gradient(135deg,#4CA477,#3f8f66);box-shadow:0 8px 22px rgba(76,164,119,.4)}
.btn-danger{flex:1;color:#fff;background:linear-gradient(135deg,#e05a5a,var(--danger))}

/* Success */
.success{position:fixed;inset:0;background:rgba(58,46,40,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60}
.success.show{display:flex}
.success .card{background:var(--sand-3);border-radius:24px;padding:44px 48px;text-align:center;box-shadow:var(--shadow-lg);animation:pop .2s ease;max-width:360px}
.success .ring{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(135deg,#4CA477,#3f8f66);display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;box-shadow:0 10px 26px rgba(76,164,119,.45);animation:ring .4s ease}
@keyframes ring{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.success .h{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;margin-bottom:6px}
.success .sub{color:var(--espresso-2);font-size:15px}
.success .amt{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:var(--espresso);margin-top:14px}

/* Report */
.report-overlay .report-card{width:100%;max-width:720px;max-height:90vh;background:var(--sand-3);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease}
.report-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px;border-bottom:1px solid var(--line);background:var(--sand-2)}
.report-head .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--espresso-2)}
.report-head .ttl{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;line-height:1.1}
.report-head .report-date{font-size:12px;color:var(--espresso-2);margin-top:2px;text-transform:capitalize}
.rep-close{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--sand-3);font-size:18px;color:var(--espresso-2);cursor:pointer}
.report-body{flex:1;overflow-y:auto;padding:18px 24px}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--sand-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .kl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--espresso-2)}
.kpi .kv{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;color:var(--espresso);line-height:1.1;margin-top:2px}
.kpi.big{background:linear-gradient(135deg,#fff6f3,var(--sand-2));border-color:var(--peach)}
.split-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.split{border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.split.cash{background:linear-gradient(135deg,#fbf3e6,var(--sand-2))}
.split.card{background:linear-gradient(135deg,#eef4fb,var(--sand-2))}
.split .sl{font-size:12px;font-weight:700;color:var(--espresso-2);display:flex;justify-content:space-between}
.split .sv{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;color:var(--espresso);margin-top:4px}
.split .sc{font-size:11px;color:var(--espresso-2);margin-top:2px}
.rep-section{margin:18px 0 8px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;color:var(--espresso);display:flex;align-items:center;gap:8px}
.rep-section::after{content:'';flex:1;height:1px;background:var(--line)}
.emp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.emp-card{background:var(--sand-2);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.emp-card.fede{background:linear-gradient(135deg,#fff2f6,#fff8f0);border-color:var(--coral)}
.emp-card .en{font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px}
.emp-card .er{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;margin-top:2px}
.emp-card .ec{font-size:11px;color:var(--espresso-2)}
.emp-card .esplit{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.emp-card .esplit div{display:flex;justify-content:space-between;font-size:11px}
.emp-card .esplit .lab{color:var(--espresso-2)}
.emp-card .esplit .num{font-weight:700}
.item-list{display:flex;flex-direction:column;gap:2px}
.item-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px dashed var(--line)}
.item-row .ie{font-size:18px}
.item-row .inm{flex:1;font-weight:600;font-size:14px}
.item-row .iq{color:var(--espresso-2);font-size:13px;min-width:70px;text-align:right}
.item-row .ir{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;min-width:74px;text-align:right}
.tx-list{display:flex;flex-direction:column}
.tx-row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px dashed var(--line)}
.tx-time{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:19px;min-width:54px;color:var(--espresso)}
.tx-body{flex:1;min-width:0}
.tx-items{font-weight:600;font-size:14px;line-height:1.28}
.tx-meta{font-size:11px;color:var(--espresso-2);margin-top:2px}
.mb{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.mb.cash{background:#f6ead2;color:#946a22}
.mb.card{background:#e6eefb;color:#3b6bbf}
.tx-total{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;min-width:74px;text-align:right}
.rep-empty{text-align:center;color:var(--espresso-2);padding:40px 20px;font-family:'Cormorant Garamond',serif;font-size:22px}
.report-foot{padding:14px 24px 18px;border-top:1px solid var(--line);background:var(--sand-2);display:flex;gap:10px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--espresso);color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);z-index:70;opacity:0;transition:transform .28s cubic-bezier(.2,1.2,.4,1),opacity .28s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media (max-width:820px){.cart{width:300px;flex-basis:300px}.header-right{gap:10px}.clock{display:none}}
@media (max-width:640px){
  main{flex-direction:column}
  .cart{width:100%;flex:0 0 auto;max-height:42vh;border-left:none;border-top:1px solid var(--line)}
  .locale{display:none}
  .report-btn span.lbl{display:none}
  .kpi-row{grid-template-columns:1fr 1fr}
}

/* ---------- Print / PDF ---------- */
#printArea{display:none}
@media print{
  @page{margin:15mm}
  html,body{overflow:visible !important;background:#fff !important;height:auto !important}
  #app,.overlay,.success,.toast{display:none !important}
  #printArea{display:block !important;color:#222;font-family:'DM Sans',Arial,sans-serif}
  .p-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:700;text-align:center;letter-spacing:.02em}
  .p-sub{text-align:center;letter-spacing:.34em;font-size:11px;color:#777;text-transform:uppercase;margin-top:2px}
  .p-rep{text-align:center;font-size:14px;margin-top:8px;text-transform:capitalize;color:#444}
  .p-rule{border:none;border-top:2px solid #333;margin:12px 0 4px}
  .p-kpis{display:flex;gap:24px;justify-content:center;margin:14px 0 6px}
  .p-kpi{text-align:center}
  .p-kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#777}
  .p-kpi .v{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700}
  #printArea h3{font-family:'Cormorant Garamond',serif;font-size:17px;margin:20px 0 4px;border-bottom:1.5px solid #333;padding-bottom:3px}
  #printArea table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 10px}
  #printArea th,#printArea td{text-align:left;padding:6px 8px;border-bottom:1px solid #e0e0e0;vertical-align:top}
  #printArea th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#777;border-bottom:1.5px solid #bbb}
  #printArea td.num,#printArea th.num{text-align:right;white-space:nowrap}
  #printArea tr{page-break-inside:avoid}
  #printArea h3{page-break-after:avoid}
  .p-foot{margin-top:18px;padding-top:8px;border-top:1px solid #ccc;font-size:10px;color:#999;text-align:center}
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand" id="brand">
      <img src="logo.png" alt="Edicola Mannelli" id="logoImg">
      <div class="wordmark"><span class="b1">EDICOLA</span><span class="b2">MANNELLI</span></div>
    </div>
    <div class="locale">Duomo</div>
    <div class="header-right">
      <div class="clock"><div class="t" id="clockT">--:--</div><div class="d" id="clockD">—</div></div>
      <button class="report-btn" id="reportBtn"><span class="ic">📊</span><span class="lbl">Riepilogo</span></button>
      <div class="takings"><div class="lbl">Incasso di oggi</div><div class="val" id="takings">€0,00</div></div>
    </div>
  </header>

  <div class="staff" id="staff"></div>
  <div class="cats" id="cats"></div>

  <main>
    <div class="products-wrap"><div class="grid" id="grid"></div></div>
    <aside class="cart">
      <div class="cart-head">
        <div class="title-row"><span class="title">Carrello</span><span class="receipt-no" id="receiptNo">Scontrino Nº 1</span></div>
        <div class="whose">Cassiere: <b id="whose">Federica</b></div>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-foot">
        <div class="rows">
          <div class="row"><span>Articoli</span><span id="itemCount">0</span></div>
          <div class="row"><span>IVA inclusa</span><span id="vat">€0,00</span></div>
          <div class="row total"><span class="lab">Totale</span><span class="amt" id="total">€0,00</span></div>
        </div>
        <div class="cart-actions">
          <button class="btn btn-clear" id="clearBtn">Svuota</button>
          <button class="btn btn-pay" id="payBtn" disabled>Paga&nbsp;·&nbsp;<span id="payAmt">€0,00</span></button>
        </div>
      </div>
    </aside>
  </main>
</div>

<!-- Checkout -->
<div class="overlay" id="checkout">
  <div class="modal">
    <div class="modal-head"><div class="k">Totale da pagare</div><div class="big" id="coTotal">€0,00</div></div>
    <div class="pay-tabs">
      <div class="pay-tab active" data-method="contanti"><span class="ic">💶</span>Contanti</div>
      <div class="pay-tab" data-method="carta"><span class="ic">💳</span>Carta</div>
    </div>
    <div class="cash-zone show" id="cashZone">
      <div class="cash-quick" id="cashQuick"></div>
      <div class="change-line"><span>Resto</span><span class="chg" id="change">€0,00</span></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-cancel" id="coCancel">Annulla</button>
      <button class="btn btn-confirm" id="coConfirm">Conferma</button>
    </div>
  </div>
</div>

<!-- Success -->
<div class="success" id="success">
  <div class="card">
    <div class="ring">✓</div>
    <div class="h">Pagamento riuscito</div>
    <div class="sub" id="successSub">Grazie e arrivederci!</div>
    <div class="amt" id="successAmt"></div>
  </div>
</div>

<!-- Report -->
<div class="overlay report-overlay" id="report">
  <div class="report-card">
    <div class="report-head">
      <div><div class="k">Riepilogo</div><div class="ttl">Report del Giorno</div><div class="report-date" id="repDate">—</div></div>
      <button class="rep-close" id="repClose">✕</button>
    </div>
    <div class="report-body" id="reportBody"></div>
    <div class="report-foot">
      <button class="btn btn-clear" id="repReset" style="flex:0 0 auto">🔄 Azzera</button>
      <button class="btn" id="repPrint" style="flex:0 0 auto;background:var(--sand-3);border:1.5px solid var(--line);color:var(--espresso)">🖨️ Stampa / PDF</button>
      <button class="btn btn-pay" id="repDone" style="flex:1;background:var(--espresso);box-shadow:none">Chiudi</button>
    </div>
  </div>
</div>

<!-- Confirm -->
<div class="overlay" id="confirmDlg">
  <div class="modal" style="max-width:400px">
    <div class="modal-head"><div class="big" style="font-size:28px" id="cfTitle">Azzerare la giornata?</div></div>
    <div style="padding:6px 26px 0;text-align:center;color:var(--espresso-2);font-size:15px;line-height:1.45" id="cfMsg"></div>
    <div class="modal-foot"><button class="btn btn-cancel" id="cfNo">Annulla</button><button class="btn btn-danger" id="cfYes">Sì, azzera</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ============ Data ============ */
const STAFF = [
  {name:'Federica', fede:true},
  {name:'Dipendente 2'},
  {name:'Dipendente 3'},
  {name:'Dipendente 4'},
  {name:'Dipendente 5'},
  {name:'Dipendente 6'},
];
const CATS = ['Tutti','Bar','Bevande','Snack','Stampa','Souvenir','Servizi','Tabacchi'];
const PRODUCTS = [
  {id:1,  nm:'Espresso',          cat:'Bar',      price:1.20, vat:10, e:'☕'},
  {id:2,  nm:'Cappuccino',        cat:'Bar',      price:1.80, vat:10, e:'☕'},
  {id:3,  nm:'Cornetto',          cat:'Bar',      price:1.50, vat:10, e:'🥐'},
  {id:4,  nm:'Gelato',            cat:'Bar',      price:3.00, vat:10, e:'🍦'},
  {id:5,  nm:'Acqua 0,5 L',       cat:'Bevande',  price:1.00, vat:10, e:'💧'},
  {id:6,  nm:'Acqua 1 L',         cat:'Bevande',  price:1.50, vat:10, e:'💧'},
  {id:7,  nm:'Bibita',            cat:'Bevande',  price:2.50, vat:10, e:'🥤'},
  {id:8,  nm:'Caramelle',         cat:'Snack',    price:1.50, vat:22, e:'🍬'},
  {id:9,  nm:'Cioccolato',        cat:'Snack',    price:2.00, vat:22, e:'🍫'},
  {id:10, nm:'Quotidiano',        cat:'Stampa',   price:2.00, vat:4,  e:'📰'},
  {id:11, nm:'Rivista',           cat:'Stampa',   price:4.50, vat:4,  e:'📖'},
  {id:12, nm:'Cartolina',         cat:'Stampa',   price:1.00, vat:22, e:'✉️'},
  {id:13, nm:'Calamita Duomo',    cat:'Souvenir', price:3.50, vat:22, e:'🧲'},
  {id:14, nm:'Tazza Milano',      cat:'Souvenir', price:9.90, vat:22, e:'🍵'},
  {id:15, nm:'Maglietta Milano',  cat:'Souvenir', price:18.00,vat:22, e:'👕'},
  {id:16, nm:'Ombrello',          cat:'Souvenir', price:12.00,vat:22, e:'☂️'},
  {id:17, nm:'Portachiavi Duomo', cat:'Souvenir', price:4.00, vat:22, e:'🔑'},
  {id:18, nm:'Biglietto ATM',     cat:'Servizi',  price:2.20, vat:0,  e:'🎫'},
  {id:19, nm:'Gratta e Vinci',    cat:'Servizi',  price:5.00, vat:0,  e:'🎟️'},
  {id:20, nm:'Sigarette',         cat:'Tabacchi', price:6.00, vat:0,  e:'🚬'},
];

/* ============ State ============ */
function load(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let carts    = load('em_carts', STAFF.map(()=>({})));       // per-employee: [{id:qty}, ...]
if(!Array.isArray(carts) || carts.length!==STAFF.length) carts = STAFF.map(()=>({}));
let salesLog = load('em_sales', []);                        // [{t,emp,method,total,vat,items:[{id,nm,e,price,qty}]}]
let activeEmp= load('em_emp', 0);
if(activeEmp<0||activeEmp>=STAFF.length) activeEmp=0;
let activeCat='Tutti';
let coMethod='contanti';
let cashGiven=0;
let pendingConfirm=null;

/* ============ Helpers ============ */
function eur(n){ return '€' + (n||0).toFixed(2).replace('.', ','); }
function prod(id){ return PRODUCTS.find(p=>p.id===+id); }
function ac(){ return carts[activeEmp]; }
function cartTotal(c){ c=c||ac(); return Object.entries(c).reduce((s,[id,q])=>s+prod(id).price*q,0); }
function cartCount(c){ c=c||ac(); return Object.values(c).reduce((s,q)=>s+q,0); }
function cartVat(c){ c=c||ac(); return Object.entries(c).reduce((s,[id,q])=>{const p=prod(id);const g=p.price*q;return s+g-g/(1+p.vat/100);},0); }
function takings(){ return salesLog.reduce((s,t)=>s+t.total,0); }
function receiptNo(){ return salesLog.length+1; }
function persist(){ save('em_carts',carts); save('em_sales',salesLog); save('em_emp',activeEmp); }

/* ============ Staff ============ */
function renderStaff(){
  const el=document.getElementById('staff'); el.innerHTML='';
  STAFF.forEach((s,i)=>{
    const n=cartCount(carts[i]);
    const d=document.createElement('div');
    d.className='emp'+(s.fede?' fede':'')+(i===activeEmp?' active':'')+(n>0?' has-cart':'');
    d.innerHTML=(s.fede?'<span class="flower">🌸</span>':'')+s.name+'<span class="cart-dot">'+n+'</span>';
    d.onclick=()=>{ activeEmp=i; persist(); renderStaff(); renderGrid(); renderCart(); };
    el.appendChild(d);
  });
}

/* ============ Categories ============ */
function renderCats(){
  const el=document.getElementById('cats'); el.innerHTML='';
  CATS.forEach(c=>{
    const d=document.createElement('div');
    d.className='cat'+(c===activeCat?' active':''); d.textContent=c;
    d.onclick=()=>{ activeCat=c; renderCats(); renderGrid(); };
    el.appendChild(d);
  });
}

/* ============ Product grid ============ */
function renderGrid(){
  const el=document.getElementById('grid'); el.innerHTML=''; const c=ac();
  PRODUCTS.filter(p=>activeCat==='Tutti'||p.cat===activeCat).forEach(p=>{
    const q=c[p.id]||0;
    const t=document.createElement('div');
    t.className='tile'+(q?' incart':'');
    t.innerHTML=`<span class="badge">${q}</span><span class="emoji">${p.e}</span><span class="nm">${p.nm}</span><span class="pr">${eur(p.price)}</span>`;
    t.onclick=()=>addToCart(p.id);
    el.appendChild(t);
  });
}

/* ============ Cart ============ */
function renderCart(){
  const box=document.getElementById('cartItems'); const c=ac(); const ids=Object.keys(c);
  if(ids.length===0){
    box.innerHTML=`<div class="empty"><div class="big">🧾</div><div class="txt">Il carrello è vuoto</div></div>`;
  }else{
    box.innerHTML='';
    ids.forEach(id=>{
      const p=prod(id), q=c[id];
      const row=document.createElement('div'); row.className='ci';
      row.innerHTML=`<div class="ci-nm"><div class="n">${p.e} ${p.nm}</div><div class="p">${eur(p.price)}</div></div>
        <div class="qty"><button class="qbtn minus">−</button><span class="qnum">${q}</span><button class="qbtn plus">+</button></div>
        <div class="ci-tot">${eur(p.price*q)}</div>`;
      row.querySelector('.minus').onclick=()=>changeQty(id,-1);
      row.querySelector('.plus').onclick=()=>changeQty(id,1);
      box.appendChild(row);
    });
  }
  const total=cartTotal();
  document.getElementById('itemCount').textContent=cartCount();
  document.getElementById('vat').textContent=eur(cartVat());
  document.getElementById('total').textContent=eur(total);
  document.getElementById('payAmt').textContent=eur(total);
  document.getElementById('receiptNo').textContent='Scontrino Nº '+receiptNo();
  document.getElementById('whose').textContent=STAFF[activeEmp].name;
  document.getElementById('payBtn').disabled=total<=0;
  document.getElementById('takings').textContent=eur(takings());
}

function addToCart(id){ ac()[id]=(ac()[id]||0)+1; persist(); renderGrid(); renderCart(); renderStaff(); }
function changeQty(id,d){ const c=ac(); c[id]=(c[id]||0)+d; if(c[id]<=0) delete c[id]; persist(); renderGrid(); renderCart(); renderStaff(); }
function clearActiveCart(){ carts[activeEmp]={}; persist(); renderGrid(); renderCart(); renderStaff(); }

/* ============ Checkout ============ */
function openCheckout(){
  if(cartTotal()<=0) return;
  document.getElementById('coTotal').textContent=eur(cartTotal());
  setMethod('contanti');
  document.getElementById('checkout').classList.add('show');
}
function setMethod(m){
  coMethod=m; cashGiven=0;
  document.querySelectorAll('.pay-tab').forEach(t=>t.classList.toggle('active',t.dataset.method===m));
  document.getElementById('cashZone').classList.toggle('show',m==='contanti');
  buildCash(); updateChange();
}
function buildCash(){
  const total=cartTotal(); const wrap=document.getElementById('cashQuick'); wrap.innerHTML='';
  const opts=[{lbl:'Esatto',v:total}];
  [5,10,20,50].forEach(v=>{ if(v>total) opts.push({lbl:eur(v),v}); });
  while(opts.length<5){ const last=opts[opts.length-1].v; opts.push({lbl:eur(last+10),v:last+10}); }
  opts.slice(0,8).forEach(o=>{
    const b=document.createElement('button'); b.className='cash-btn'; b.textContent=o.lbl;
    b.onclick=()=>{ cashGiven=o.v; document.querySelectorAll('.cash-btn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); updateChange(); };
    wrap.appendChild(b);
  });
}
function updateChange(){ document.getElementById('change').textContent=eur(Math.max(0,cashGiven-cartTotal())); }

function confirmPayment(){
  const c=ac(); const total=cartTotal(c); if(total<=0) return;
  const items=Object.entries(c).map(([id,q])=>{const p=prod(id);return {id:p.id,nm:p.nm,e:p.e,price:p.price,qty:q};});
  const now=new Date();
  salesLog.push({
    t: now.toLocaleTimeString('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit'}),
    emp: STAFF[activeEmp].name, method: coMethod, total, vat: cartVat(c), items
  });
  const change=(coMethod==='contanti'&&cashGiven>total)?cashGiven-total:0;
  carts[activeEmp]={}; persist();
  document.getElementById('checkout').classList.remove('show');
  document.getElementById('successAmt').textContent='Totale '+eur(total)+(change>0?'  ·  Resto '+eur(change):'');
  document.getElementById('successSub').textContent=coMethod==='carta'?'Pagamento con carta approvato':'Grazie e arrivederci!';
  const s=document.getElementById('success'); s.classList.add('show');
  setTimeout(()=>{ s.classList.remove('show'); renderGrid(); renderCart(); renderStaff(); }, 1700);
}

/* ============ Report ============ */
function openReport(){
  renderReport();
  document.getElementById('repDate').textContent=new Date().toLocaleDateString('it-IT',{timeZone:'Europe/Rome',weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('report').classList.add('show');
}
function renderReport(){
  const body=document.getElementById('reportBody');
  const sales=salesLog;
  if(sales.length===0){ body.innerHTML=`<div class="rep-empty">Nessuna vendita registrata oggi.<br>Le vendite appariranno qui.</div>`; return; }
  const total=sales.reduce((s,t)=>s+t.total,0);
  const vat=sales.reduce((s,t)=>s+t.vat,0);
  const cash=sales.filter(t=>t.method==='contanti');
  const card=sales.filter(t=>t.method==='carta');
  const cashT=cash.reduce((s,t)=>s+t.total,0);
  const cardT=card.reduce((s,t)=>s+t.total,0);
  const pct=x=>total>0?Math.round(x/total*100):0;
  const avg=total/sales.length;

  let h='';
  h+=`<div class="kpi-row">
    <div class="kpi big"><div class="kl">Incasso Totale</div><div class="kv">${eur(total)}</div></div>
    <div class="kpi"><div class="kl">Scontrini</div><div class="kv">${sales.length}</div></div>
    <div class="kpi"><div class="kl">Scontrino Medio</div><div class="kv">${eur(avg)}</div></div>
  </div>`;
  h+=`<div class="split-row">
    <div class="split cash"><div class="sl"><span>💶 Contanti</span><span>${pct(cashT)}%</span></div><div class="sv">${eur(cashT)}</div><div class="sc">${cash.length} vendit${cash.length===1?'a':'e'}</div></div>
    <div class="split card"><div class="sl"><span>💳 Carta</span><span>${pct(cardT)}%</span></div><div class="sv">${eur(cardT)}</div><div class="sc">${card.length} vendit${card.length===1?'a':'e'}</div></div>
  </div>`;
  h+=`<div class="split-row"><div class="split" style="grid-column:1/-1;background:var(--sand-2)"><div class="sl"><span>🧾 IVA inclusa nel totale</span></div><div class="sv" style="font-size:22px">${eur(vat)}</div></div></div>`;

  // Per-employee
  h+=`<div class="rep-section">Per cassiere</div><div class="emp-cards">`;
  STAFF.forEach(s=>{
    const txs=sales.filter(t=>t.emp===s.name); if(txs.length===0) return;
    const rev=txs.reduce((a,t)=>a+t.total,0);
    const ec=txs.filter(t=>t.method==='contanti').reduce((a,t)=>a+t.total,0);
    const ed=txs.filter(t=>t.method==='carta').reduce((a,t)=>a+t.total,0);
    h+=`<div class="emp-card${s.fede?' fede':''}">
      <div class="en">${s.fede?'🌸 ':''}${s.name}</div>
      <div class="er">${eur(rev)}</div>
      <div class="ec">${txs.length} scontrin${txs.length===1?'o':'i'}</div>
      <div class="esplit">
        <div><span class="lab">💶 Contanti</span><span class="num">${eur(ec)}</span></div>
        <div><span class="lab">💳 Carta</span><span class="num">${eur(ed)}</span></div>
      </div></div>`;
  });
  h+=`</div>`;

  // Items sold
  const it={};
  sales.forEach(t=>t.items.forEach(i=>{ if(!it[i.id]) it[i.id]={nm:i.nm,e:i.e,qty:0,rev:0}; it[i.id].qty+=i.qty; it[i.id].rev+=i.qty*i.price; }));
  const sorted=Object.values(it).sort((a,b)=>b.qty-a.qty);
  h+=`<div class="rep-section">Articoli venduti</div><div class="item-list">`;
  sorted.forEach(i=>{ h+=`<div class="item-row"><span class="ie">${i.e}</span><span class="inm">${i.nm}</span><span class="iq">${i.qty} pz</span><span class="ir">${eur(i.rev)}</span></div>`; });
  h+=`</div>`;

  // Individual transactions — newest first, with timestamp
  h+=`<div class="rep-section">Transazioni (${sales.length})</div><div class="tx-list">`;
  sales.slice().reverse().forEach((t,idx)=>{
    const no=sales.length-idx;
    h+=`<div class="tx-row">
      <div class="tx-time">${t.t}</div>
      <div class="tx-body"><div class="tx-items">${itemsSummary(t)}</div><div class="tx-meta">Scontrino Nº ${no} · ${t.emp}</div></div>
      <span class="mb ${t.method==='carta'?'card':'cash'}">${t.method==='carta'?'💳 Carta':'💶 Contanti'}</span>
      <div class="tx-total">${eur(t.total)}</div>
    </div>`;
  });
  h+=`</div>`;

  body.innerHTML=h;
}
function itemsSummary(t){ return t.items.map(i=>i.qty+'× '+i.nm).join(', '); }

/* ============ Print / PDF ============ */
function printReport(){
  const sales=salesLog;
  if(sales.length===0){ toast('Nessuna vendita da stampare'); return; }
  const now=new Date();
  const dateStr=now.toLocaleDateString('it-IT',{timeZone:'Europe/Rome',weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const genStr=now.toLocaleString('it-IT',{timeZone:'Europe/Rome',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const total=sales.reduce((s,t)=>s+t.total,0);
  const vat=sales.reduce((s,t)=>s+t.vat,0);
  const cash=sales.filter(t=>t.method==='contanti'), card=sales.filter(t=>t.method==='carta');
  const cashT=cash.reduce((s,t)=>s+t.total,0), cardT=card.reduce((s,t)=>s+t.total,0);
  const avg=total/sales.length;

  let h=`<div class="p-doc">
    <div class="p-title">EDICOLA MANNELLI</div>
    <div class="p-sub">Duomo · Milano</div>
    <div class="p-rep">Report del Giorno — ${dateStr}</div>
    <hr class="p-rule">
    <div class="p-kpis">
      <div class="p-kpi"><div class="l">Incasso Totale</div><div class="v">${eur(total)}</div></div>
      <div class="p-kpi"><div class="l">Scontrini</div><div class="v">${sales.length}</div></div>
      <div class="p-kpi"><div class="l">Scontrino Medio</div><div class="v">${eur(avg)}</div></div>
    </div>
    <table><tbody>
      <tr><td>💶 Contanti (${cash.length})</td><td class="num">${eur(cashT)}</td></tr>
      <tr><td>💳 Carta (${card.length})</td><td class="num">${eur(cardT)}</td></tr>
      <tr><td>🧾 IVA inclusa</td><td class="num">${eur(vat)}</td></tr>
    </tbody></table>`;

  // Per cassiere
  h+=`<h3>Per cassiere</h3><table><thead><tr><th>Cassiere</th><th class="num">Scontrini</th><th class="num">Contanti</th><th class="num">Carta</th><th class="num">Totale</th></tr></thead><tbody>`;
  STAFF.forEach(s=>{
    const txs=sales.filter(t=>t.emp===s.name); if(!txs.length) return;
    const rev=txs.reduce((a,t)=>a+t.total,0);
    const ec=txs.filter(t=>t.method==='contanti').reduce((a,t)=>a+t.total,0);
    const ed=txs.filter(t=>t.method==='carta').reduce((a,t)=>a+t.total,0);
    h+=`<tr><td>${s.name}</td><td class="num">${txs.length}</td><td class="num">${eur(ec)}</td><td class="num">${eur(ed)}</td><td class="num"><b>${eur(rev)}</b></td></tr>`;
  });
  h+=`</tbody></table>`;

  // Articoli
  const it={};
  sales.forEach(t=>t.items.forEach(i=>{ if(!it[i.id]) it[i.id]={nm:i.nm,qty:0,rev:0}; it[i.id].qty+=i.qty; it[i.id].rev+=i.qty*i.price; }));
  const sorted=Object.values(it).sort((a,b)=>b.qty-a.qty);
  h+=`<h3>Articoli venduti</h3><table><thead><tr><th>Articolo</th><th class="num">Q.tà</th><th class="num">Ricavo</th></tr></thead><tbody>`;
  sorted.forEach(i=>{ h+=`<tr><td>${i.nm}</td><td class="num">${i.qty}</td><td class="num">${eur(i.rev)}</td></tr>`; });
  h+=`</tbody></table>`;

  // Transazioni
  h+=`<h3>Transazioni</h3><table><thead><tr><th>Ora</th><th>Nº</th><th>Cassiere</th><th>Articoli</th><th>Pagamento</th><th class="num">Totale</th></tr></thead><tbody>`;
  sales.forEach((t,i)=>{
    h+=`<tr><td>${t.t}</td><td>${i+1}</td><td>${t.emp}</td><td>${itemsSummary(t)}</td><td>${t.method==='carta'?'Carta':'Contanti'}</td><td class="num">${eur(t.total)}</td></tr>`;
  });
  h+=`</tbody></table>`;

  h+=`<div class="p-foot">Generato il ${genStr} · Edicola Mannelli — Duomo</div></div>`;

  document.getElementById('printArea').innerHTML=h;
  window.print();
}

/* ============ Reset ============ */
function askReset(){
  const t=takings();
  showConfirm('Azzerare la giornata?',
    `Verranno cancellate <b>${salesLog.length}</b> vendite (${eur(t)}) e tutti i carrelli. L'incasso torna a zero.<br><br>Questa azione non può essere annullata.`,
    ()=>{
      salesLog=[]; carts=STAFF.map(()=>({})); persist();
      document.getElementById('report').classList.remove('show');
      renderStaff(); renderGrid(); renderCart();
      toast('Giornata azzerata ✓');
    });
}
function showConfirm(title,msg,onYes){
  document.getElementById('cfTitle').textContent=title;
  document.getElementById('cfMsg').innerHTML=msg;
  pendingConfirm=onYes;
  document.getElementById('confirmDlg').classList.add('show');
}

/* ============ Toast ============ */
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1700); }

/* ============ Clock ============ */
function tick(){
  const now=new Date(), opt={timeZone:'Europe/Rome'};
  document.getElementById('clockT').textContent=now.toLocaleTimeString('it-IT',{...opt,hour:'2-digit',minute:'2-digit'});
  document.getElementById('clockD').textContent=now.toLocaleDateString('it-IT',{...opt,weekday:'long',day:'numeric',month:'long'});
}

/* ============ Wire up ============ */
document.getElementById('logoImg').addEventListener('error',()=>document.getElementById('brand').classList.add('fallback'));
document.getElementById('payBtn').onclick=openCheckout;
document.getElementById('clearBtn').onclick=()=>{ if(cartCount()){ clearActiveCart(); toast('Carrello svuotato'); } };
document.getElementById('coCancel').onclick=()=>document.getElementById('checkout').classList.remove('show');
document.getElementById('coConfirm').onclick=confirmPayment;
document.querySelectorAll('.pay-tab').forEach(t=>t.onclick=()=>setMethod(t.dataset.method));
document.getElementById('checkout').addEventListener('click',e=>{ if(e.target.id==='checkout') e.currentTarget.classList.remove('show'); });
document.getElementById('reportBtn').onclick=openReport;
document.getElementById('repClose').onclick=()=>document.getElementById('report').classList.remove('show');
document.getElementById('repDone').onclick=()=>document.getElementById('report').classList.remove('show');
document.getElementById('repReset').onclick=askReset;
document.getElementById('repPrint').onclick=printReport;
document.getElementById('report').addEventListener('click',e=>{ if(e.target.id==='report') e.currentTarget.classList.remove('show'); });
document.getElementById('cfNo').onclick=()=>document.getElementById('confirmDlg').classList.remove('show');
document.getElementById('cfYes').onclick=()=>{ document.getElementById('confirmDlg').classList.remove('show'); if(pendingConfirm) pendingConfirm(); pendingConfirm=null; };

/* ============ Boot ============ */
renderStaff(); renderCats(); renderGrid(); renderCart();
tick(); setInterval(tick,10000);
</script>
</body>
</html>
