<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Edicola Mannelli — Duomo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:        #E9DEC8;   /* piazza travertine canvas */
  --sand-2:      #F3ECDC;   /* cards / panels          */
  --sand-3:      #FBF7EE;   /* lightest surface        */
  --line:        #D9CBB0;   /* hairline borders        */
  --espresso:    #3A2E28;   /* primary ink             */
  --espresso-2:  #6B584E;   /* secondary ink           */
  --coral:       #F26D8B;   /* ranunculus pink         */
  --coral-2:     #FF7E5F;   /* ranunculus coral        */
  --peach:       #FFB088;   /* ranunculus peach        */
  --gold:        #B08A54;   /* logo bronze accent      */
  --ok:          #4CA477;
  --shadow:      0 6px 22px rgba(58,46,40,.12);
  --shadow-lg:   0 18px 50px rgba(58,46,40,.22);
  --federica: linear-gradient(135deg,#E94FA1 0%,#F26D8B 32%,#FF7E5F 66%,#FFB088 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--sand);
  color:var(--espresso);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- Header ---------- */
header{
  display:flex;align-items:center;gap:16px;
  padding:10px 20px;
  background:var(--sand-3);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(58,46,40,.05);
  z-index:20;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:52px;width:auto;object-fit:contain}
.brand .wordmark{display:none;flex-direction:column;line-height:1}
.brand .wordmark .b1{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.28em;font-size:13px;color:var(--espresso-2)}
.brand .wordmark .b2{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.06em;font-size:26px;color:var(--espresso)}
.brand.fallback img{display:none}
.brand.fallback .wordmark{display:flex}

.locale{
  margin-left:6px;padding:4px 14px;border-left:1px solid var(--line);
  font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;
  letter-spacing:.34em;color:var(--gold);text-transform:uppercase;
}
.header-right{margin-left:auto;display:flex;align-items:center;gap:20px}
.clock{text-align:right;line-height:1.15}
.clock .t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px}
.clock .d{font-size:11px;color:var(--espresso-2);text-transform:capitalize;letter-spacing:.02em}
.takings{
  text-align:right;padding:6px 16px;border-radius:12px;
  background:var(--sand);border:1px solid var(--line);
}
.takings .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--espresso-2)}
.takings .val{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:var(--espresso)}

/* ---------- Staff tabs ---------- */
.staff{
  display:flex;gap:8px;padding:10px 20px;
  background:var(--sand-2);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.staff::-webkit-scrollbar{display:none}
.emp{
  flex:0 0 auto;padding:9px 20px;border-radius:11px;cursor:pointer;
  font-weight:700;font-size:15px;color:var(--espresso-2);
  background:var(--sand-3);border:1.5px solid var(--line);
  transition:transform .12s ease, box-shadow .12s ease;
  white-space:nowrap;display:flex;align-items:center;gap:7px;
}
.emp:active{transform:scale(.96)}
.emp.active{color:#fff;background:var(--espresso);border-color:var(--espresso);box-shadow:var(--shadow)}
/* Federica — the ranunculus jewel */
.emp.fede{
  color:#fff;background:var(--federica);border:none;position:relative;
  background-size:200% 200%;box-shadow:0 6px 18px rgba(233,79,161,.35);
  animation:bloom 7s ease infinite;
}
.emp.fede .flower{font-size:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.emp.fede.active{outline:3px solid rgba(255,255,255,.85);outline-offset:2px;transform:translateY(-1px)}
@keyframes bloom{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ---------- Category filters ---------- */
.cats{display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;padding:7px 16px;border-radius:20px;cursor:pointer;
  font-size:13px;font-weight:700;letter-spacing:.02em;
  color:var(--espresso-2);background:transparent;border:1.5px solid var(--line);
  transition:all .12s ease;white-space:nowrap;
}
.cat:active{transform:scale(.95)}
.cat.active{color:#fff;background:var(--coral);border-color:var(--coral);box-shadow:0 4px 12px rgba(242,109,139,.35)}

/* ---------- Main ---------- */
main{flex:1;display:flex;gap:0;min-height:0}
.products-wrap{flex:1;overflow-y:auto;padding:14px 20px 24px}
.grid{
  display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
}
.tile{
  background:var(--sand-3);border:1.5px solid var(--line);border-radius:16px;
  padding:14px 12px 12px;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:8px;min-height:118px;
  transition:transform .1s ease, box-shadow .1s ease, border-color .1s ease;
}
.tile:active{transform:scale(.96)}
.tile:hover{box-shadow:var(--shadow);border-color:var(--peach)}
.tile .emoji{font-size:30px;line-height:1}
.tile .nm{font-weight:700;font-size:14px;line-height:1.2;color:var(--espresso)}
.tile .pr{margin-top:auto;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;color:var(--espresso)}
.tile .badge{
  position:absolute;top:8px;right:8px;min-width:22px;height:22px;padding:0 6px;
  border-radius:11px;background:var(--coral);color:#fff;font-size:12px;font-weight:700;
  display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(242,109,139,.5);
}
.tile.incart{border-color:var(--coral);background:linear-gradient(180deg,#fff6f3,var(--sand-3))}
.tile.incart .badge{display:flex}

/* ---------- Cart ---------- */
.cart{
  width:360px;flex:0 0 360px;background:var(--sand-3);
  border-left:1px solid var(--line);display:flex;flex-direction:column;
  box-shadow:-6px 0 24px rgba(58,46,40,.06);
}
.cart-head{
  padding:16px 20px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;
}
.cart-head .title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px}
.cart-head .receipt-no{font-size:12px;color:var(--espresso-2);letter-spacing:.03em}
.cart-items{flex:1;overflow-y:auto;padding:8px 14px}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--espresso-2);text-align:center;padding:20px;
}
.empty .big{font-size:44px;opacity:.5}
.empty .txt{font-family:'Cormorant Garamond',serif;font-size:20px}
.ci{
  display:flex;align-items:center;gap:10px;padding:10px 8px;
  border-bottom:1px dashed var(--line);
}
.ci .ci-nm{flex:1;min-width:0}
.ci .ci-nm .n{font-weight:700;font-size:14px}
.ci .ci-nm .p{font-size:12px;color:var(--espresso-2)}
.qty{display:flex;align-items:center;gap:8px}
.qbtn{
  width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--sand-2);font-size:19px;font-weight:700;color:var(--espresso);
  cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
}
.qbtn:active{transform:scale(.9)}
.qbtn.minus{color:var(--coral-2)}
.qnum{min-width:20px;text-align:center;font-weight:700;font-size:15px}
.ci .ci-tot{width:66px;text-align:right;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:17px}

.cart-foot{padding:14px 20px 18px;border-top:1px solid var(--line);background:var(--sand-2)}
.rows{margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--espresso-2);margin:3px 0}
.row.total{color:var(--espresso);align-items:baseline;margin-top:8px}
.row.total .lab{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700}
.row.total .amt{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700}
.cart-actions{display:flex;gap:10px}
.btn{
  border:none;border-radius:13px;padding:16px;font-family:'DM Sans',sans-serif;
  font-weight:700;font-size:16px;cursor:pointer;transition:transform .1s ease, filter .1s ease;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-clear{flex:0 0 auto;background:var(--sand-3);color:var(--espresso-2);border:1.5px solid var(--line);padding:16px 18px}
.btn-pay{flex:1;color:#fff;background:linear-gradient(135deg,var(--coral),var(--coral-2));box-shadow:0 8px 22px rgba(242,109,139,.4)}
.btn-pay:not(:disabled):hover{filter:brightness(1.04)}

/* ---------- Checkout modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(58,46,40,.5);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.overlay.show{display:flex}
.modal{
  width:100%;max-width:440px;background:var(--sand-3);border-radius:22px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:22px 24px 6px;text-align:center}
.modal-head .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--espresso-2)}
.modal-head .big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:46px;color:var(--espresso);line-height:1.1}
.pay-tabs{display:flex;gap:10px;padding:16px 24px 6px}
.pay-tab{
  flex:1;padding:14px;border-radius:13px;border:2px solid var(--line);background:var(--sand-2);
  cursor:pointer;font-weight:700;font-size:15px;text-align:center;color:var(--espresso-2);
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.pay-tab .ic{font-size:24px}
.pay-tab.active{border-color:var(--coral);color:var(--espresso);background:#fff6f3}
.cash-zone{padding:8px 24px 4px;display:none}
.cash-zone.show{display:block}
.cash-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.cash-btn{padding:12px 4px;border-radius:11px;border:1.5px solid var(--line);background:var(--sand-2);
  font-weight:700;font-size:15px;cursor:pointer;color:var(--espresso)}
.cash-btn:active{transform:scale(.94)}
.cash-btn.sel{background:var(--espresso);color:#fff;border-color:var(--espresso)}
.change-line{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px 2px;font-size:15px;color:var(--espresso-2)}
.change-line .chg{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;color:var(--ok)}
.modal-foot{padding:14px 24px 22px;display:flex;gap:10px}
.btn-cancel{flex:0 0 auto;background:var(--sand-2);color:var(--espresso-2);border:1.5px solid var(--line);padding:16px 20px}
.btn-confirm{flex:1;color:#fff;background:linear-gradient(135deg,#4CA477,#3f8f66);box-shadow:0 8px 22px rgba(76,164,119,.4)}

/* ---------- Success ---------- */
.success{
  position:fixed;inset:0;background:rgba(58,46,40,.55);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:60;
}
.success.show{display:flex}
.success .card{
  background:var(--sand-3);border-radius:24px;padding:44px 48px;text-align:center;
  box-shadow:var(--shadow-lg);animation:pop .2s ease;max-width:360px;
}
.success .ring{
  width:92px;height:92px;border-radius:50%;margin:0 auto 18px;
  background:linear-gradient(135deg,#4CA477,#3f8f66);
  display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;
  box-shadow:0 10px 26px rgba(76,164,119,.45);animation:ring .4s ease;
}
@keyframes ring{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.success .h{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;margin-bottom:6px}
.success .sub{color:var(--espresso-2);font-size:15px}
.success .amt{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:var(--espresso);margin-top:14px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--espresso);color:#fff;padding:12px 22px;border-radius:30px;
  font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);z-index:70;opacity:0;
  transition:transform .28s cubic-bezier(.2,1.2,.4,1),opacity .28s;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ---------- Responsive ---------- */
@media (max-width:820px){
  .cart{width:300px;flex-basis:300px}
  .header-right{gap:12px}
  .clock{display:none}
}
@media (max-width:640px){
  main{flex-direction:column}
  .cart{width:100%;flex:0 0 auto;max-height:42vh;border-left:none;border-top:1px solid var(--line)}
  .locale{display:none}
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand" id="brand">
      <img src="logo.png" alt="Edicola Mannelli" id="logoImg">
      <div class="wordmark"><span class="b1">EDICOLA</span><span class="b2">MANNELLI</span></div>
    </div>
    <div class="locale">Duomo</div>
    <div class="header-right">
      <div class="clock"><div class="t" id="clockT">--:--</div><div class="d" id="clockD">—</div></div>
      <div class="takings"><div class="lbl">Incasso di oggi</div><div class="val" id="takings">€0,00</div></div>
    </div>
  </header>

  <div class="staff" id="staff"></div>

  <div class="cats" id="cats"></div>

  <main>
    <div class="products-wrap">
      <div class="grid" id="grid"></div>
    </div>

    <aside class="cart">
      <div class="cart-head">
        <span class="title">Carrello</span>
        <span class="receipt-no" id="receiptNo">Scontrino Nº 1</span>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-foot">
        <div class="rows">
          <div class="row"><span>Articoli</span><span id="itemCount">0</span></div>
          <div class="row"><span>IVA inclusa</span><span id="vat">€0,00</span></div>
          <div class="row total"><span class="lab">Totale</span><span class="amt" id="total">€0,00</span></div>
        </div>
        <div class="cart-actions">
          <button class="btn btn-clear" id="clearBtn">Svuota</button>
          <button class="btn btn-pay" id="payBtn" disabled>Paga&nbsp;·&nbsp;<span id="payAmt">€0,00</span></button>
        </div>
      </div>
    </aside>
  </main>
</div>

<!-- Checkout -->
<div class="overlay" id="checkout">
  <div class="modal">
    <div class="modal-head">
      <div class="k">Totale da pagare</div>
      <div class="big" id="coTotal">€0,00</div>
    </div>
    <div class="pay-tabs">
      <div class="pay-tab active" data-method="contanti"><span class="ic">💶</span>Contanti</div>
      <div class="pay-tab" data-method="carta"><span class="ic">💳</span>Carta</div>
    </div>
    <div class="cash-zone show" id="cashZone">
      <div class="cash-quick" id="cashQuick"></div>
      <div class="change-line"><span>Resto</span><span class="chg" id="change">€0,00</span></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-cancel" id="coCancel">Annulla</button>
      <button class="btn btn-confirm" id="coConfirm">Conferma</button>
    </div>
  </div>
</div>

<!-- Success -->
<div class="success" id="success">
  <div class="card">
    <div class="ring">✓</div>
    <div class="h">Pagamento riuscito</div>
    <div class="sub" id="successSub">Grazie e arrivederci!</div>
    <div class="amt" id="successAmt"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Data ============ */
const STAFF = [
  {name:'Federica', fede:true},
  {name:'Dipendente 2'},
  {name:'Dipendente 3'},
  {name:'Dipendente 4'},
  {name:'Dipendente 5'},
  {name:'Dipendente 6'},
];

const CATS = ['Tutti','Bar','Bevande','Snack','Stampa','Souvenir','Servizi','Tabacchi'];

/* prices in € ; vat is informational (Italian IVA) */
const PRODUCTS = [
  {id:1,  nm:'Espresso',          cat:'Bar',      price:1.20, vat:10, e:'☕'},
  {id:2,  nm:'Cappuccino',        cat:'Bar',      price:1.80, vat:10, e:'☕'},
  {id:3,  nm:'Cornetto',          cat:'Bar',      price:1.50, vat:10, e:'🥐'},
  {id:4,  nm:'Gelato',            cat:'Bar',      price:3.00, vat:10, e:'🍦'},
  {id:5,  nm:'Acqua 0,5 L',       cat:'Bevande',  price:1.00, vat:10, e:'💧'},
  {id:6,  nm:'Acqua 1 L',         cat:'Bevande',  price:1.50, vat:10, e:'💧'},
  {id:7,  nm:'Bibita',            cat:'Bevande',  price:2.50, vat:10, e:'🥤'},
  {id:8,  nm:'Caramelle',         cat:'Snack',    price:1.50, vat:22, e:'🍬'},
  {id:9,  nm:'Cioccolato',        cat:'Snack',    price:2.00, vat:22, e:'🍫'},
  {id:10, nm:'Quotidiano',        cat:'Stampa',   price:2.00, vat:4,  e:'📰'},
  {id:11, nm:'Rivista',           cat:'Stampa',   price:4.50, vat:4,  e:'📖'},
  {id:12, nm:'Cartolina',         cat:'Stampa',   price:1.00, vat:22, e:'✉️'},
  {id:13, nm:'Calamita Duomo',    cat:'Souvenir', price:3.50, vat:22, e:'🧲'},
  {id:14, nm:'Tazza Milano',      cat:'Souvenir', price:9.90, vat:22, e:'🍵'},
  {id:15, nm:'Maglietta Milano',  cat:'Souvenir', price:18.00,vat:22, e:'👕'},
  {id:16, nm:'Ombrello',          cat:'Souvenir', price:12.00,vat:22, e:'☂️'},
  {id:17, nm:'Portachiavi Duomo', cat:'Souvenir', price:4.00, vat:22, e:'🔑'},
  {id:18, nm:'Biglietto ATM',     cat:'Servizi',  price:2.20, vat:0,  e:'🎫'},
  {id:19, nm:'Gratta e Vinci',    cat:'Servizi',  price:5.00, vat:0,  e:'🎟️'},
  {id:20, nm:'Sigarette',         cat:'Tabacchi', price:6.00, vat:0,  e:'🚬'},
];

/* ============ State ============ */
let cart = {};                 // id -> qty
let activeCat = 'Tutti';
let activeEmp = 0;
let receiptNo = load('em_receipt', 1);
let takings   = load('em_takings', 0);
let coMethod  = 'contanti';
let cashGiven = 0;

/* ============ Helpers ============ */
function eur(n){ return '€' + n.toFixed(2).replace('.', ','); }
function load(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function prod(id){ return PRODUCTS.find(p=>p.id===id); }
function cartTotal(){ return Object.entries(cart).reduce((s,[id,q])=>s+prod(+id).price*q,0); }
function cartCount(){ return Object.values(cart).reduce((s,q)=>s+q,0); }
function cartVat(){
  return Object.entries(cart).reduce((s,[id,q])=>{
    const p=prod(+id); const gross=p.price*q; return s + gross - gross/(1+p.vat/100);
  },0);
}

/* ============ Render: staff ============ */
function renderStaff(){
  const el=document.getElementById('staff'); el.innerHTML='';
  STAFF.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='emp'+(s.fede?' fede':'')+(i===activeEmp?' active':'');
    d.innerHTML = s.fede ? '<span class="flower">🌸</span>'+s.name : s.name;
    d.onclick=()=>{ activeEmp=i; renderStaff(); toast('Turno: '+s.name); };
    el.appendChild(d);
  });
}

/* ============ Render: categories ============ */
function renderCats(){
  const el=document.getElementById('cats'); el.innerHTML='';
  CATS.forEach(c=>{
    const d=document.createElement('div');
    d.className='cat'+(c===activeCat?' active':'');
    d.textContent=c;
    d.onclick=()=>{ activeCat=c; renderCats(); renderGrid(); };
    el.appendChild(d);
  });
}

/* ============ Render: product grid ============ */
function renderGrid(){
  const el=document.getElementById('grid'); el.innerHTML='';
  PRODUCTS.filter(p=>activeCat==='Tutti'||p.cat===activeCat).forEach(p=>{
    const q=cart[p.id]||0;
    const t=document.createElement('div');
    t.className='tile'+(q?' incart':'');
    t.innerHTML=`<span class="badge">${q}</span>
      <span class="emoji">${p.e}</span>
      <span class="nm">${p.nm}</span>
      <span class="pr">${eur(p.price)}</span>`;
    t.onclick=()=>addToCart(p.id);
    el.appendChild(t);
  });
}

/* ============ Render: cart ============ */
function renderCart(){
  const box=document.getElementById('cartItems');
  const ids=Object.keys(cart);
  if(ids.length===0){
    box.innerHTML=`<div class="empty"><div class="big">🧾</div><div class="txt">Il carrello è vuoto</div></div>`;
  }else{
    box.innerHTML='';
    ids.forEach(id=>{
      const p=prod(+id), q=cart[id];
      const row=document.createElement('div'); row.className='ci';
      row.innerHTML=`
        <div class="ci-nm"><div class="n">${p.e} ${p.nm}</div><div class="p">${eur(p.price)}</div></div>
        <div class="qty">
          <button class="qbtn minus">−</button>
          <span class="qnum">${q}</span>
          <button class="qbtn plus">+</button>
        </div>
        <div class="ci-tot">${eur(p.price*q)}</div>`;
      row.querySelector('.minus').onclick=()=>changeQty(+id,-1);
      row.querySelector('.plus').onclick=()=>changeQty(+id,1);
      box.appendChild(row);
    });
  }
  const total=cartTotal();
  document.getElementById('itemCount').textContent=cartCount();
  document.getElementById('vat').textContent=eur(cartVat());
  document.getElementById('total').textContent=eur(total);
  document.getElementById('payAmt').textContent=eur(total);
  document.getElementById('receiptNo').textContent='Scontrino Nº '+receiptNo;
  document.getElementById('payBtn').disabled = total<=0;
  document.getElementById('takings').textContent=eur(takings);
}

/* ============ Cart ops ============ */
function addToCart(id){ cart[id]=(cart[id]||0)+1; renderGrid(); renderCart(); }
function changeQty(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  renderGrid(); renderCart();
}
function clearCart(){ cart={}; renderGrid(); renderCart(); }

/* ============ Checkout ============ */
function openCheckout(){
  const total=cartTotal();
  if(total<=0) return;
  document.getElementById('coTotal').textContent=eur(total);
  setMethod('contanti');
  document.getElementById('checkout').classList.add('show');
}
function setMethod(m){
  coMethod=m; cashGiven=0;
  document.querySelectorAll('.pay-tab').forEach(t=>t.classList.toggle('active',t.dataset.method===m));
  document.getElementById('cashZone').classList.toggle('show',m==='contanti');
  buildCash(); updateChange();
}
function buildCash(){
  const total=cartTotal();
  const wrap=document.getElementById('cashQuick'); wrap.innerHTML='';
  const opts=[]; opts.push({lbl:'Esatto',v:total});
  [5,10,20,50].forEach(v=>{ if(v>total) opts.push({lbl:eur(v),v}); });
  // ensure at least a few notes
  while(opts.length<5){ const last=opts[opts.length-1].v; opts.push({lbl:eur(last+10),v:last+10}); }
  opts.slice(0,8).forEach(o=>{
    const b=document.createElement('button'); b.className='cash-btn'; b.textContent=o.lbl;
    b.onclick=()=>{ cashGiven=o.v; document.querySelectorAll('.cash-btn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); updateChange(); };
    wrap.appendChild(b);
  });
}
function updateChange(){
  const total=cartTotal();
  const change=Math.max(0, cashGiven-total);
  document.getElementById('change').textContent=eur(change);
}
function confirmPayment(){
  const total=cartTotal();
  takings+=total; save('em_takings',takings);
  const change=(coMethod==='contanti'&&cashGiven>total)?cashGiven-total:0;
  receiptNo++; save('em_receipt',receiptNo);
  document.getElementById('checkout').classList.remove('show');
  // success
  document.getElementById('successAmt').textContent='Totale '+eur(total)+(change>0?'  ·  Resto '+eur(change):'');
  document.getElementById('successSub').textContent = coMethod==='carta' ? 'Pagamento con carta approvato' : 'Grazie e arrivederci!';
  const s=document.getElementById('success'); s.classList.add('show');
  setTimeout(()=>{ s.classList.remove('show'); clearCart(); }, 1900);
}

/* ============ Toast ============ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1600);
}

/* ============ Clock ============ */
function tick(){
  const now=new Date();
  const opt={timeZone:'Europe/Rome'};
  const t=now.toLocaleTimeString('it-IT',{...opt,hour:'2-digit',minute:'2-digit'});
  const d=now.toLocaleDateString('it-IT',{...opt,weekday:'long',day:'numeric',month:'long'});
  document.getElementById('clockT').textContent=t;
  document.getElementById('clockD').textContent=d;
}

/* ============ Logo fallback ============ */
document.getElementById('logoImg').addEventListener('error',()=>{
  document.getElementById('brand').classList.add('fallback');
});

/* ============ Wire up ============ */
document.getElementById('payBtn').onclick=openCheckout;
document.getElementById('clearBtn').onclick=()=>{ if(cartCount()) { clearCart(); toast('Carrello svuotato'); } };
document.getElementById('coCancel').onclick=()=>document.getElementById('checkout').classList.remove('show');
document.getElementById('coConfirm').onclick=confirmPayment;
document.querySelectorAll('.pay-tab').forEach(t=>t.onclick=()=>setMethod(t.dataset.method));
document.getElementById('checkout').addEventListener('click',e=>{ if(e.target.id==='checkout') e.currentTarget.classList.remove('show'); });

/* ============ Boot ============ */
renderStaff(); renderCats(); renderGrid(); renderCart();
tick(); setInterval(tick,10000);
</script>
</body>
</html>
